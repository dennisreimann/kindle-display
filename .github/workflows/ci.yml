name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      # used by the pngcrush integration test
      - name: Install pngcrush
        run: sudo apt-get update && sudo apt-get install -y pngcrush

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
